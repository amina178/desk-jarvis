# Deploys the Streamlit app to a Hugging Face Space on every push to main.
# Setup (once): repo Settings -> Secrets and variables -> Actions
#   secret   HF_TOKEN     a Hugging Face token with WRITE access
#   variable HF_USERNAME  your Hugging Face user name
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          pip install -q "huggingface_hub>=0.24"
          python - <<'PY'
          import os, shutil
          from huggingface_hub import HfApi

          # The Space needs its own README with a YAML header
          shutil.copy("deploy/hf_space_README.md", "README.md")
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = f"{os.environ['HF_USERNAME']}/desk-jarvis"
          # Creates the Space if it does not exist yet (Docker SDK)
          api.create_repo(repo, repo_type="space", space_sdk="docker",
                          exist_ok=True)
          # upload_folder stores large binaries via LFS automatically
          api.upload_folder(
              repo_id=repo, repo_type="space", folder_path=".",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              ignore_patterns=[".git/*", ".github/*", "notebooks/*",
                               "tests/*", "deploy/*",
                               "models/gestures/mobilenet*/*",
                               "models/gestures/small_cnn/*",
                               "models/gestures/mlp/model_int8.onnx"],
              delete_patterns=["*"])  # mirror: remove stale files
          print(f"Deployed to https://huggingface.co/spaces/{repo}")
          PY
