# Pushes the app to a Hugging Face Space on every push to main.
# Setup (once): repo Settings -> Secrets and variables -> Actions
#   secret   HF_TOKEN     a Hugging Face token with WRITE access
#   variable HF_USERNAME  your Hugging Face user name
# and create an empty Space "desk-jarvis" (SDK: Docker) on Hugging Face.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build a Space snapshot and push it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git lfs install
          # The Space gets its own README (YAML header) and only the
          # models the app uses; history is not needed there.
          git checkout --orphan space
          cp deploy/hf_space_README.md README.md
          rm -rf models/gestures/mobilenet* models/gestures/small_cnn \
                 models/gestures/mlp/model_int8.onnx notebooks .github
          git lfs track "*.onnx" "*.joblib"
          git add -A
          git commit -q -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/desk-jarvis" \
            space:main
