name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2
          pip install -r requirements.txt pytest flake8
      - name: Lint (PEP8)
        run: flake8 src scripts tests app
      - name: Download MediaPipe models
        run: python scripts/download_models.py
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # Failed tests are also reported as annotations on the run page
          pytest -q -rf --tb=line 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR)|Error" pytest.log | head -20 |
              while read -r line; do echo "::error::$line"; done
            exit 1
          }
